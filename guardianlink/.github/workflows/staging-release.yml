name: Staging release candidate

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: SemVer, e.g. 0.1.0-rc.1
        required: true
        type: string
      versionCode:
        description: Monotonically increasing positive Android versionCode (> 1)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  verify:
    uses: ./.github/workflows/quality-reusable.yml
  verify-codeql:
    uses: ./.github/workflows/codeql.yml

  build-staging:
    needs: [verify, verify-codeql]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate inputs and signing configuration
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && (( VERSION_CODE > 1 ))
          [[ "$API_BASE_URL" == https://* ]]
          CERT_HEX="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$CERT_HEX" =~ ^[a-f0-9]{64}$ ]]
          [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]
      - name: Build signed Staging APKs
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ inputs.versionCode }}
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          GL_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          GL_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          GL_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/guardianlink-staging.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          export GL_RELEASE_KEYSTORE="$KEYSTORE"
          gradle -p android \
            :app-parent:assembleRelease :app-child:assembleRelease \
            -PguardianReleaseBaseUrl="$API_BASE_URL" \
            -PguardianVersionName="$VERSION_NAME" \
            -PguardianVersionCode="$VERSION_CODE" \
            --no-daemon
      - name: Verify APK signatures and checksums
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          for apk in android/app-parent/build/outputs/apk/release/*.apk android/app-child/build/outputs/apk/release/*.apk; do
            [[ -f "$apk" ]]
            output="$("$APKSIGNER" verify --verbose --print-certs "$apk")"
            actual="$(printf '%s\n' "$output" | awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}' | tr -d ':')"
            [[ "$actual" == "$expected" ]]
            sha256sum "$apk"
          done
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish Staging backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/guardianlink-server:staging-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: staging-apk-${{ inputs.versionName }}-${{ github.sha }}
          path: |
            android/app-parent/build/outputs/apk/release/*.apk
            android/app-child/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
