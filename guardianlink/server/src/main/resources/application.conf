ktor {
  deployment {
    requestReadTimeoutSeconds = 30
    responseWriteTimeoutSeconds = 30
    port = 8080
    port = ${?PORT}
    shutdownGracePeriod = 5000
    shutdownTimeout = 10000
  }
  application {
    modules = [ ir.guardianlink.server.MainKt.module ]
  }
}

app {
  dbUrl = "jdbc:postgresql://localhost:5432/guardianlink"
  dbUrl = ${?DB_URL}
  # No baked-in database credentials: set DB_USER and DB_PASS via secret manager/environment.
  dbUser = ${?DB_USER}
  dbPass = ${?DB_PASS}
  dataDir = "./data"
  dataDir = ${?DATA_DIR}

  dbPoolMaxSize = 10
  dbPoolMaxSize = ${?DB_POOL_MAX}
  dbPoolMinIdle = 2
  dbPoolMinIdle = ${?DB_POOL_MIN}
  dbConnectionTimeoutMs = 5000
  dbConnectionTimeoutMs = ${?DB_CONNECTION_TIMEOUT_MS}
  dbValidationTimeoutMs = 3000
  dbValidationTimeoutMs = ${?DB_VALIDATION_TIMEOUT_MS}
  dbIdleTimeoutMs = 600000
  dbIdleTimeoutMs = ${?DB_IDLE_TIMEOUT_MS}
  dbMaxLifetimeMs = 1800000
  dbMaxLifetimeMs = ${?DB_MAX_LIFETIME_MS}
  environment = "development"
  environment = ${?APP_ENV}
  logLevel = "INFO"
  logLevel = ${?LOG_LEVEL}

  accessTokenTtlSec = 900
  accessTokenTtlSec = ${?ACCESS_TTL_SEC}
  refreshTokenTtlSec = 2592000
  pairingTtlSec = 300
  pairingTtlSec = ${?PAIRING_TTL_SEC}
  exchangeTtlSec = 120
  presenceLeaseSec = 1200
  presenceLeaseSec = ${?PRESENCE_LEASE_SEC}

  defaultBatteryLowPct = 30
  defaultBatteryLowPct = ${?BATTERY_LOW_PCT}
  defaultBatteryCriticalPct = 15
  defaultBatteryCriticalPct = ${?BATTERY_CRITICAL_PCT}
  defaultSyncDelayedSec = 1800
  defaultSyncDelayedSec = ${?SYNC_DELAYED_SEC}
  defaultOfflineSec = 3600
  defaultOfflineSec = ${?OFFLINE_SEC}
  defaultHeartbeatIntervalSec = 900
  defaultHeartbeatIntervalSec = ${?HEARTBEAT_INTERVAL_SEC}

  defaultLocationStaleSec = 3600
  defaultLocationStaleSec = ${?LOCATION_STALE_SEC}
  # Phase 5 — Geofence: cooldown بین دو گذار (debounce مرزی)، بدترین دقت قابل قبول، سقف zone
  geofenceCooldownSec = 300
  geofenceCooldownSec = ${?GEO_COOLDOWN_SEC}
  geofenceMinAccuracyM = 500
  geofenceMinAccuracyM = ${?GEO_MIN_ACC_M}
  geofenceMaxPerDevice = 50
  geofenceMaxPerDevice = ${?GEO_MAX_ZONES}
  geofenceMinRadiusM = 50
  geofenceMinRadiusM = ${?GEO_MIN_RADIUS_M}
  geofenceMaxRadiusM = 5000
  geofenceMaxRadiusM = ${?GEO_MAX_RADIUS_M}
  geofenceEventRetentionDays = 30
  geofenceEventRetentionDays = ${?GEO_EVENT_RETENTION_DAYS}
}
